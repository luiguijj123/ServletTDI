spring.application.name=Tarea3Servlet
spring.config.import=optional:file:./.local/application.properties
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
server.port=${PORT:8081}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/huanca_creditos?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:huanca_tarea2}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
server.error.include-message=never
server.error.include-stacktrace=never
